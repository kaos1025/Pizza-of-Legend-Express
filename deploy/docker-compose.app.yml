# ============================================================
# Pizza of Legend Express — 앱 + 리버스 프록시 (VPS)
#
# 전제: 같은 VPS 에 self-hosted Supabase 가 떠 있고
#       그 compose 프로젝트의 네트워크 이름이 supabase_default 이다.
#       (디렉토리 이름이 다르면 아래 networks.supabase.name 수정)
#
# 사용:
#   cp deploy/env.app.example deploy/.env.app   # 값 채우기
#   docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.app up -d --build
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    environment:
      # 서버 컴포넌트/API 라우트에서도 읽으므로 런타임에도 주입
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ADMIN_PIN: ${ADMIN_PIN}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - web
      - supabase

networks:
  web:
  supabase:
    external: true
    name: supabase_default

volumes:
  caddy_data:
  caddy_config:
